<html>
    <head>
        <script>
            function info ()
            {
                let age = parseInt(prompt("enter value of a: "));
                if (age >= 18)
            {
                let c = confirm ("do you want to submit your vote ?");
                if(c)
            {
                alert ("your response submitted");
            }
            else
            {
                alert("response not submitted");
            }
            }
            else
            {
                alert("you are not eligible for vote");
            }
            }    
        </script>
    </head>
     <body>
        <input type="button" onclick = "info()" value = "Result">
    </body>
</html>
