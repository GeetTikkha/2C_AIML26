<!-- 2. Bank Account Management System -->


<html>
    <head>
        <script>
            class bankAccount
            {
                constructor(accountNo, holderName, balance)
                {
                    this.accountNo = accountNo;
                    this.holderName = holderName;
                    this.balance = balance;
                }
                    deposit(amount)
                    {
                        this.balance = this.balance + amount;
                        console.log("final amount:", this.balance);
                    }
                    withdraw(amount)
                    {
                        if (amount > this.balance)
                    {
                        console.log("insufficient amount");
                    }
                    else
                    {
                        this.balance = this.balance - amount;
                        console.log("amount withdrwn successfully");
                    }
                    }
                    displayBalance()
                    {
                        console.log(this.balance);
                    }
                    static bankInfo()
                    {
                        console.log("abc bank");
                        console.log(this.accountNo);
                        console.log(this.holderName);
                        console.log(this.balance);
                    }
                }
                let b1 = new bankAccount("123", "geet", "500");
                b1.deposit(10);
                b1.withdraw(2500);
                b1.withdraw(200);
                b1.displayBalance();
                bankAccount.bankInfo();
        </script>
    </head>
</html>
