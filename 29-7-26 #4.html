<html>
    <head>
        <script>
            function display(){
                let n = parseInt(prompt("Enter value of a",));
                for (let i=0; i<n;i++)
                {
                    for(let j=0;j<=i;j++)
                    {
                    document.write("*");
                    }
                    document.write("</br>");
                }
            }
        </script>
    </head>
    <body>
        <input type="button" onclick="display()" value="ShowPattern">
    </body>
</html>
